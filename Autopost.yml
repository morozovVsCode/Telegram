name: Autopost

on:
  schedule:
    # Время в UTC. Зимой (Берлин, UTC+1) это 08:05 и 17:05.
    - cron: "5 7 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post - опубликовать следующий пост, check - проверить картинки"
        type: choice
        options:
          - post
          - check
        default: post

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run autopost
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTS_PER_RUN: "1"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python autopost.py check
          else
            python autopost.py
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state: update progress" && git push)
